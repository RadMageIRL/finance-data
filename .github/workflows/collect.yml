# The collector, prepared for stage B and limited to fixtures now. There is no schedule: a
# schedule is added only when scheduled collection is authorized (stage C). A live run is refused
# by the pipeline's activation guard whatever this workflow asks, and no live transport exists.
name: collect

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixture only at this stage
        type: choice
        options: [fixture]
        default: fixture

permissions: {}

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: A live run is refused
        run: |
          if node pipeline/bin/collect.mjs --mode live --root "$RUNNER_TEMP/live-root"; then
            echo "a live run was not refused"
            exit 1
          fi
      - name: Collect from fixtures
        env:
          MODE: ${{ inputs.mode }}
        run: node pipeline/bin/collect.mjs --mode "$MODE" --root "$RUNNER_TEMP/fixture-root"
      - name: Keep the fixture root for inspection (convenience only; never the state store)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-root
          path: ${{ runner.temp }}/fixture-root
          retention-days: 7
