# The collector (DATA_CONVENTIONS 21.3, Stage C): scheduled private collection every four hours
# at :17 UTC, and manual runs. The schedule is a Cloudflare Worker cron, the one line
# 17 */4 * * *, that dispatches this workflow in mode timer with the slot it fired for (decision
# P43); GitHub's own cron was best effort (two runs for eight slots) and is no longer a trigger.
# The schedule branches below stay so the GitHub cron can be restored as a trigger by adding the
# schedule lines back. A timer run is a scheduled run: trigger schedule, run id
# sched-<run id>-<attempt>, its title names its slot, and the self-check facts count it as
# scheduled. Fixture mode runs the deterministic scenario. Live mode collects into the private
# state repository only, through a token minted for that repository alone, after the independent
# checker has validated the result. A scheduled run collects only while the repository variables
# LIVE_COLLECTION_AUTHORIZED and COLLECTION_SCHEDULE_ENABLED are both "true"; otherwise its job is
# skipped. A manual live run needs LIVE_COLLECTION_AUTHORIZED and the typed confirmation LIVE.
# Nothing is published: no Pages, no release, no Labs route.
name: collect
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'timer') && format('collect timer {0}', inputs.slot) || 'collect' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: fixture, live (one private collection), or timer (the scheduled collection, dispatched by the Cloudflare Worker)
        type: choice
        options: [fixture, live, timer]
        default: fixture
      confirm:
        description: For live mode, type LIVE
        type: string
        default: ''
      slot:
        description: For timer mode, the cron slot the timer fired for (UTC, YYYY-MM-DDTHH:MM:SSZ)
        type: string
        default: ''

permissions: {}

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  fixture:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: A live run without a promoted state store is refused
        run: |
          mkdir -p "$RUNNER_TEMP/empty-store"
          if node pipeline/bin/collect.mjs --mode live --root "$RUNNER_TEMP/live-root" --state "$RUNNER_TEMP/empty-store" --run refused-check --trigger manual; then
            echo "a live run was not refused"
            exit 1
          fi
      - name: Collect from fixtures
        run: node pipeline/bin/collect.mjs --mode fixture --root "$RUNNER_TEMP/fixture-root"

  collect:
    if: >-
      (github.event_name == 'schedule' && vars.LIVE_COLLECTION_AUTHORIZED == 'true' && vars.COLLECTION_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'timer' && vars.LIVE_COLLECTION_AUTHORIZED == 'true' && vars.COLLECTION_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      wrote: ${{ steps.collect.outputs.wrote }}
      ledger: ${{ steps.collect.outputs.ledger }}
      stage: ${{ steps.collect.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refuse a run that is not authorized
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          AUTHORIZED: ${{ vars.LIVE_COLLECTION_AUTHORIZED }}
          ENABLED: ${{ vars.COLLECTION_SCHEDULE_ENABLED }}
          CONFIRM: ${{ inputs.confirm }}
          SLOT: ${{ inputs.slot }}
        run: |
          if [ "$AUTHORIZED" != "true" ]; then echo "live collection is not authorized"; exit 1; fi
          if [ "$EVENT" = "schedule" ] && [ "$ENABLED" != "true" ]; then echo "scheduled collection is not enabled"; exit 1; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "timer" ]; then
            if [ "$ENABLED" != "true" ]; then echo "scheduled collection is not enabled"; exit 1; fi
            if ! [[ "$SLOT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then echo "a timer run needs its slot as YYYY-MM-DDTHH:MM:SSZ"; exit 1; fi
            echo "timer slot ${SLOT}"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$CONFIRM" != "LIVE" ]; then echo "a manual live run needs the confirmation LIVE"; exit 1; fi
      - name: Mint a token for the state store only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.STATE_APP_ID }}
          private-key: ${{ secrets.STATE_APP_PRIVATE_KEY }}
          owner: RadMageIRL
          repositories: finance-data-state
          permission-contents: write
      - name: Check out the state store (Stage C refuses a store with no commit)
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          basic="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${basic}"
          git init -q -b main state-store
          git -C state-store remote add origin https://github.com/RadMageIRL/finance-data-state.git
          git -C state-store config http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic}"
          refs="$(git -C state-store ls-remote origin)"
          if printf '%s\n' "$refs" | awk '$2 == "refs/heads/main" { found = 1 } END { exit !found }'; then
            git -C state-store fetch -q --depth 1 origin main
            git -C state-store checkout -q -B main FETCH_HEAD
            echo "state store at $(git -C state-store rev-parse HEAD)"
          else
            echo "the state store has no main branch; Stage C does not start from an empty store"
            exit 1
          fi
      - name: Commit identity of the app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          git -C state-store config user.name "${SLUG}[bot]"
          git -C state-store config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - name: Self-check facts (this workflow's state and runs, the repository's last push)
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml" --jq .state)"
          # A timer run (titled "collect timer <slot>") is a scheduled run (decision P43).
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/runs?per_page=30" --jq '[.workflow_runs[] | {event: (if .event == "workflow_dispatch" and ((.display_title // "") | startswith("collect timer ")) then "schedule" else .event end), conclusion, created_at}]')"
          pushed="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .pushed_at)"
          set -e
          if [ -n "$state" ] && [ -n "$runs" ] && [ -n "$pushed" ]; then
            printf '{"workflow":{"state":"%s"},"repository":{"pushed_at":"%s"},"runs":%s}\n' "$state" "$pushed" "$runs" > "$RUNNER_TEMP/facts.json"
            echo "args=--facts $RUNNER_TEMP/facts.json" >> "$GITHUB_OUTPUT"
          else
            echo "args=--facts-unavailable" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect, validate with the independent checker, then write the state store without force
        id: collect
        env:
          LIVE_COLLECTION_AUTHORIZED: ${{ vars.LIVE_COLLECTION_AUTHORIZED }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          FACTS: ${{ steps.facts.outputs.args }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$EVENT" = "schedule" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "timer" ]; }; then trigger=schedule; run="sched-${RUN_ID}-${ATTEMPT}"; else trigger=manual; run="live-${RUN_ID}-${ATTEMPT}"; fi
          echo "stage=collection" >> "$GITHUB_OUTPUT"
          set +e
          # shellcheck disable=SC2086
          node pipeline/bin/collect.mjs --mode live --root "$RUNNER_TEMP/root" --state state-store --run "$run" --trigger "$trigger" $FACTS --summary "$RUNNER_TEMP/summary.json" --push
          code=$?
          set -e
          if [ -f "$RUNNER_TEMP/summary.json" ]; then
            echo "wrote=true" >> "$GITHUB_OUTPUT"
            echo "ledger=$(node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(Buffer.from(JSON.stringify({ledger:s.ledger})).toString('base64'))" "$RUNNER_TEMP/summary.json")" >> "$GITHUB_OUTPUT"
            node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const t=['| Field | Value |','|---|---|',...['outcome','run','commit'].map((k)=>'| '+k+' | '+s[k]+' |'),'| accepted | '+s.accepted.snapshot+' '+s.accepted.manifest_sha256+' |','| requests | '+s.requests.map((r)=>r.host+' '+r.status).join(', ')+' |','| added | '+s.added.files+' files, '+s.added.bytes+' bytes |','| alerts | '+s.ledger.map((a)=>a.key).join(', ')+' |'];process.stdout.write(t.join('\n')+'\n')" "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

  issues:
    needs: collect
    if: always() && needs.collect.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Reconcile the alert issues with the ledger the run wrote
        if: needs.collect.outputs.wrote == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER: ${{ needs.collect.outputs.ledger }}
        run: |
          printf '%s' "$LEDGER" | base64 -d > "$RUNNER_TEMP/ledger.json"
          node pipeline/bin/issues.mjs --summary "$RUNNER_TEMP/ledger.json"
      - name: Keep one collect-failed issue open (the store was not written)
        if: needs.collect.outputs.wrote != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.collect.outputs.stage || 'setup' }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: node pipeline/bin/issues.mjs --failed "$STAGE" --run "${RUN_ID}-${ATTEMPT}"
