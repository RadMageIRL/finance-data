# Publication of the live window to GitHub Pages, prepared for stage D and disabled. The job runs
# only when the repository variable PUBLICATION_ENABLED is "true", which is not set, and its first
# step refuses to continue until publication is authorized. Pages is not enabled on this repository.
name: publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: publication
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publication is not authorized
        run: |
          echo "Publication of economic datasets is not authorized (stage D)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: live
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
